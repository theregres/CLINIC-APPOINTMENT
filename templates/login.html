{% extends "base.html" %}
{% block content %}
<div style="max-width: 28rem; margin: 2.5rem auto; padding: 1.5rem; background-color: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <div class="logo-badge indigo">{% include "_logo.html" %}</div>
    <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Login</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151;">Username or Email</label>
            <input type="text" name="username" autocomplete="username" required style="margin-top: 0.25rem; display: block; width: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151;">Password</label>
            <input type="password" name="password" required style="margin-top: 0.25rem; display: block; width: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem;">
        </div>
        
        <!-- Forgot Link -->
        <div style="margin-bottom: 1rem; display: flex; justify-content: flex-end;">
            <a href="{{ url_for('forgot_password') }}" style="font-size: 0.875rem; color: #4f46e5; text-decoration: underline;">Forgot password?</a>
        </div>

        <button type="submit" style="width: 100%; padding: 0.5rem 1rem; background-color: #4f46e5; color: white; font-weight: 600; border-radius: 0.375rem; border: none; cursor: pointer;">Login</button>
    </form>
    
    <div style="margin-top: 1.5rem; display: flex; justify-content: space-between;">
        <a href="{{ url_for('register') }}" style="font-size: 0.875rem; color: #4f46e5; text-decoration: underline;">Register as Patient</a>
        <a href="{{ url_for('register_doctor') }}" style="font-size: 0.875rem; color: #4f46e5; text-decoration: underline;">Register as Doctor</a>
    </div>
</div>
{% endblock %}
