{% extends "base.html" %}
{% block content %}
<div style="max-width: 28rem; margin: 2.5rem auto; padding: 1.5rem; background-color: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <div class="logo-badge indigo">{% include "_logo.html" %}</div>
    <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Forgot Password</h2>
    <p style="font-size: 0.875rem; color: #4b5563; margin-bottom: 1rem;">Enter your account email address and we'll send you a verification code to reset your password.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151;">Email Address</label>
            <input type="email" name="email" required style="margin-top: 0.25rem; display: block; width: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem;">
        </div>
        <button type="submit" style="width: 100%; padding: 0.5rem 1rem; background-color: #4f46e5; color: white; font-weight: 600; border-radius: 0.375rem; border: none; cursor: pointer;">Send Reset Code</button>
    </form>
    <div style="margin-top: 1rem; text-align: center;">
        <a href="{{ url_for('login') }}" style="font-size: 0.875rem; color: #4f46e5; text-decoration: underline;">Back to Login</a>
    </div>
</div>
{% endblock %}
